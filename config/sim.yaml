# =============================================================================
#  F1TENTH simulator configuration (overrides the bundled config/sim.yaml).
#  Schema matches f1tenth/f1tenth_gym_ros.
# =============================================================================
bridge:
  ros__parameters:
    # Topic / namespace setup -------------------------------------------------
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'           # -> /scan      (what wall_follow.py reads)
    ego_odom_topic: 'odom'
    ego_drive_topic: 'drive'         # -> /drive     (what wall_follow.py writes)
    ego_opp_odom_topic: 'opp_odom'

    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # Sensor model ------------------------------------------------------------
    scan_distance_to_base_link: 0.275
    scan_fov: 4.7
    scan_beams: 1080

    # Map ---------------------------------------------------------------------
    map_path: '/sim_ws/src/f1tenth_gym_ros/maps/levine'
    map_img_ext: '.png'

    # Simulation --------------------------------------------------------------
    num_agent: 1

    # Ego starting pose (on the Levine track)
    sx: 0.0
    sy: 0.0
    stheta: 0.0

    # Opponent starting pose (unused with num_agent: 1)
    sx1: 2.0
    sy1: 0.5
    stheta1: 0.0

    # Keyboard teleop OFF -> the wall follower controls the car.
    kb_teleop: False
